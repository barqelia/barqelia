<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barça Players</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #071a36;
        color: white;
        min-height: 100vh;
    }
    header {
        background: linear-gradient(135deg, #071a36, #142b55);
        padding: 25px 20px;
        text-align: center;
        border-bottom: 3px solid #ed1c24;
    }
    .logo {
        font-size: 42px;
        margin-bottom: 5px;
    }
    h1 {
        font-size: 30px;
        color: #fff;
    }
    .subtitle {
        color: #b8c7df;
        margin-top: 7px;
    }
    .container {
        max-width: 1100px;
        margin: auto;
        padding: 30px 20px;
    }
    /* SEARCH */
    .search-box {
        position: relative;
        margin-bottom: 30px;
    }
    #searchInput {
        width: 100%;
        padding: 17px 20px;
        border-radius: 14px;
        border: 2px solid #29466f;
        background: #10294d;
        color: white;
        font-size: 17px;
        outline: none;
        transition: 0.2s;
    }
    #searchInput:focus {
        border-color: #ed1c24;
        box-shadow: 0 0 15px rgba(237, 28, 36, 0.25);
    }
    #searchInput::placeholder {
        color: #9eacc2;
    }
    /* PLAYERS */
    #playersGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
    }
    .player-card {
        background: #10294d;
        border: 1px solid #29466f;
        border-radius: 18px;
        overflow: hidden;
        cursor: pointer;
        transition: 0.25s;
    }
    .player-card:hover {
        transform: translateY(-6px);
        border-color: #ed1c24;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .player-photo {
        width: 100%;
        height: 240px;
        object-fit: cover;
        background: #172f55;
    }
    .player-info {
        padding: 17px;
    }
    .player-name {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 7px;
    }
    .player-position {
        color: #b9c8df;
        font-size: 14px;
    }
    .club-small {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #dce5f3;
        font-size: 14px;
    }
    .club-logo {
        width: 28px;
        height: 28px;
        object-fit: contain;
    }
    /* PLAYER PAGE */
    #playerPage {
        display: none;
    }
    .back-button {
        border: none;
        background: #ed1c24;
        color: white;
        padding: 12px 20px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 25px;
        transition: 0.2s;
    }
    .back-button:hover {
        background: #c9141b;
        transform: translateX(-3px);
    }
    .player-profile {
        background: #10294d;
        border: 1px solid #29466f;
        border-radius: 22px;
        padding: 30px;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 40px;
        align-items: center;
    }
    .profile-photo {
        width: 100%;
        height: 450px;
        object-fit: cover;
        border-radius: 18px;
        background: #172f55;
    }
    .profile-name {
        font-size: 42px;
        margin-bottom: 25px;
    }
    .detail {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 15px 0;
        border-bottom: 1px solid #29466f;
        font-size: 17px;
    }
    .detail-icon {
        font-size: 24px;
        width: 35px;
    }
    .detail-label {
        color: #9eacc2;
        display: block;
        font-size: 13px;
        margin-bottom: 3px;
    }
    .detail-value {
        font-weight: bold;
    }
    .club-profile {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .club-profile img {
        width: 42px;
        height: 42px;
        object-fit: contain;
    }
    .description {
        margin-top: 25px;
        line-height: 1.7;
        color: #c9d5e8;
    }
    /* NO RESULTS */
    #noResults {
        display: none;
        text-align: center;
        color: #9eacc2;
        padding: 50px 10px;
        font-size: 18px;
    }
    footer {
        text-align: center;
        padding: 35px 20px;
        color: #7185a5;
    }
    @media (max-width: 750px) {
        .player-profile {
            grid-template-columns: 1fr;
        }
        .profile-photo {
            height: 380px;
        }
        .profile-name {
            font-size: 32px;
        }
    }
</style>
</head>
<body>
<header>
    <div class="logo">🔵🔴</div>
    <h1>Barça Players</h1>
    <p class="subtitle">Players Database</p>
</header>
<main class="container">
    <!-- PLAYERS SCREEN -->
    <section id="playersPage">
        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="🔎 Search player..."
                autocomplete="off"
            >
        </div>
        <div id="playersGrid"></div>
        <div id="noResults">
            No players found 😕
        </div>
    </section>
    <!-- PLAYER PROFILE SCREEN -->
    <section id="playerPage">
        <button class="back-button" onclick="showPlayers()">
            ← Back to Players
        </button>
        <div class="player-profile">
            <img
                id="profilePhoto"
                class="profile-photo"
                src=""
                alt="Player"
            >
            <div>
                <h2 id="profileName" class="profile-name"></h2>
                <div class="detail">
                    <div class="detail-icon">🇪🇸</div>
                    <div>
                        <span class="detail-label">Nationality</span>
                        <span id="profileNationality" class="detail-value"></span>
                    </div>
                </div>
                <div class="detail">
                    <div class="detail-icon">⚽</div>
                    <div>
                        <span class="detail-label">Position</span>
                        <span id="profilePosition" class="detail-value"></span>
                    </div>
                </div>
                <div class="detail">
                    <div class="detail-icon">🏟️</div>
                    <div>
                        <span class="detail-label">Club</span>
                        <div class="club-profile">
                            <img id="profileClubLogo" src="" alt="Club logo">
                            <span id="profileClub" class="detail-value"></span>
                        </div>
                    </div>
                </div>
                <p id="profileDescription" class="description"></p>
            </div>
        </div>
    </section>
</main>
<footer>
    FC Barcelona Players Database © 2026
</footer>
<script>

        description: "Brazilian winger with excellent pace, work rate, dribbling and goal-scoring ability."
    },
    {

        clubLogo: "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Ferran_Torres_2022.jpg/640px-Ferran_Torres_2022.jpg",
        description: "Spanish forward capable of playing across the front three and contributing with goals and movement."
    },
    {
        name: "João Cancelo",
        nationality: "Portugal",
        position: "Full-back",
        club: "FC Barcelona",
        clubLogo: "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Joao_Cancelo_2022.jpg/640px-Joao_Cancelo_2022.jpg",
        description: "Portuguese full-back known for his attacking contribution, technical ability and versatility."
    },
    {

        clubLogo: "https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg",
        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Juli%C3%A1n_%C3%81lvarez_2022.jpg/640px-Juli%C3%A1n_%C3%81lvarez_2022.jpg",
        description: "Argentine forward known for his movement, finishing, pressing and ability to play multiple attacking roles."
    },
    {

        nationality: "England",
        position: "Left Winger",

        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Anthony_Gordon_2022.jpg/640px-Anthony_Gordon_2022.jpg",
        description: "English winger who combines speed, direct running and aggressive attacking play."
    },
    {
        name: "João Pedro",
        nationality: "Brazil",
        position: "Forward",
        club: "Chelsea",
        clubLogo: "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg",
        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Joao_Pedro_2024.jpg/640px-Joao_Pedro_2024.jpg",
        description: "Brazilian attacker capable of playing as a striker or in wider attacking positions."
    },
    {
        name: "Pedri",
        nationality: "Spain",
        position: "Central Midfielder",
        club: "FC Barcelona",
        clubLogo: "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
        photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Pedri_2022.jpg/640px-Pedri_2022.jpg",
        description: "One of Barcelona's most technically gifted midfielders."
    },
    {
        name: "Hamza Abdelkarim",
        nationality: "Morocco",
        position: "Forward",
        club: "FC Barcelona",

        description: "Young attacking player who has attracted attention with his performances and potential."
    }
];
/* =========================================
   CLUB LOGOS
   ========================================= */
const clubLogos = {
    "Racing Santander":
        "https://upload.wikimedia.org/wikipedia/en/2/2a/Racing_de_Santander_crest.svg",
    "Rayo Vallecano":
        "https://upload.wikimedia.org/wikipedia/en/1/1f/Rayo_Vallecano_logo.svg",
    "Málaga":
        "https://upload.wikimedia.org/wikipedia/en/5/5c/Malaga_CF.svg",
    "Levante":
        "https://upload.wikimedia.org/wikipedia/en/6/6e/Levante_UD_logo.svg",
    "FC Barcelona":
        "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg",
    "Atlético Madrid":
        "https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg",
    "Newcastle United":
        "https://upload.wikimedia.org/wikipedia/en/5/56/Newcastle_United_Logo.svg",
    "Chelsea":
        "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg"
};
/* =========================================
   DISPLAY PLAYERS
   ========================================= */
const playersGrid = document.getElementById("playersGrid");
const searchInput = document.getElementById("searchInput");
const noResults = document.getElementById("noResults");
function displayPlayers(list) {
    playersGrid.innerHTML = "";
    if (list.length === 0) {
        noResults.style.display = "block";
        return;
    }
    noResults.style.display = "none";
    list.forEach((player, index) => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `
            <img
                class="player-photo"
                src="${player.photo}"
                alt="${player.name}"
                onerror="this.src='https://via.placeholder.com/640x800/172f55/ffffff?text=Player'"
            >
            <div class="player-info">
                <div class="player-name">
                    ${player.name}
                </div>
                <div class="player-position">
                    ${player.position}
                </div>
                <div class="club-small">
                    <img
                        class="club-logo"
                        src="${player.clubLogo}"
                        alt="${player.club}"
                        onerror="this.style.display='none'"
                    >
                    ${player.club}
                </div>
            </div>
        `;
        card.addEventListener("click", () => {
            openPlayer(player);
        });
        playersGrid.appendChild(card);
    });
}
/* =========================================
   SEARCH
   ========================================= */
searchInput.addEventListener("input", function () {
    const search = this.value.toLowerCase().trim();
    const filteredPlayers = players.filter(player =>
        player.name.toLowerCase().includes(search)
    );
    displayPlayers(filteredPlayers);
});
/* =========================================
   OPEN PLAYER
   ========================================= */
function openPlayer(player) {
    document.getElementById("playersPage").style.display = "none";
    document.getElementById("playerPage").style.display = "block";
    document.getElementById("profilePhoto").src = player.photo;
    document.getElementById("profilePhoto").alt = player.name;
    document.getElementById("profileName").textContent = player.name;
    document.getElementById("profileNationality").textContent = player.nationality;
    document.getElementById("profilePosition").textContent = player.position;
    document.getElementById("profileClub").textContent = player.club;
    document.getElementById("profileDescription").textContent = player.description;
    document.getElementById("profileClubLogo").src =
        clubLogos[player.club] || player.clubLogo;
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
/* =========================================
   BACK TO PLAYERS
   ========================================= */
function showPlayers() {
    document.getElementById("playerPage").style.display = "none";
    document.getElementById("playersPage").style.display = "block";
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
/* =========================================
   START
   ========================================= */
displayPlayers(players);
</script>
</body>
</html>
